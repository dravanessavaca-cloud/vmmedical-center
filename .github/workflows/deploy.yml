name: Deploy VM Medical Center

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://pjwefetpngpmeaymzdew.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBqd2VmZXRwbmdwbWVheW16ZGV3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDc3NTMyNTIsImV4cCI6MjA2MzMyOTI1Mn0.3y_E7nGbvSrFkVZhh1FE2a8pb4kgNMW6E3gfQZo1zQ

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: vmmedical-center
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}